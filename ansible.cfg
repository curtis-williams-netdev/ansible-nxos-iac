[defaults]
# Points Ansible to your inventory folder
inventory = inventory/

# Points Ansible to the vault password file so it decrypts vault.yml automatically
# This file lives on the jump server only - it is never committed to GitHub (.gitignore excludes it)
vault_password_file = .vault_pass

# Suppresses deprecation warnings that clutter output
deprecation_warnings = False

# Disables SSH host key checking - acceptable in a managed datacenter environment
# In a stricter environment you'd set this to True and manage known_hosts
host_key_checking = False

# How many devices Ansible works on in parallel
# Start conservative, increase once you've validated things work
forks = 10

# Roles path tells Ansible where to find your roles
roles_path = roles/

[persistent_connection]
# How long Ansible waits for a network device to respond (in seconds)
connect_timeout = 60
command_timeout = 60
