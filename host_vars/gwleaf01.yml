---
# host_vars/gwleaf01.yml
# Per-device variables for a gateway leaf (VXLAN stitching VTEP)

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
device_hostname: gwleaf01
ansible_host: 192.0.2.30

# -----------------------------------------------------------------------------
# Loopbacks
# -----------------------------------------------------------------------------
loopback0_ip: 10.0.255.30/32
loopback1000_ip: 10.0.253.30/32

# -----------------------------------------------------------------------------
# VPC
# -----------------------------------------------------------------------------
vpc_domain_id: 30
vpc_role_priority: 100
vpc_peer_keepalive_dest: 192.0.2.31
vpc_peer_keepalive_src: 192.0.2.30
vpc_peer_gateway: true
vpc_auto_recovery: true
vpc_delay_restore: 150
vpc_ip_arp_synchronize: true

# -----------------------------------------------------------------------------
# OSPF
# -----------------------------------------------------------------------------
ospf_process_id: 1
ospf_router_id: 10.0.255.30

# -----------------------------------------------------------------------------
# BGP
# -----------------------------------------------------------------------------
bgp_asn: 65000
bgp_router_id: 10.0.255.30
bgp_evpn_enabled: true

bgp_neighbors:
  - ip: 10.0.255.10
    description: spine01
    peer_template: SPINE
  - ip: 10.0.255.11
    description: spine02
    peer_template: SPINE

bgp_vrfs:
  - name: ZONE_A
    neighbors:
      - ip: 10.0.100.20
        description: core-sw01-ZONE_A
        remote_as: 65000
  - name: ZONE_B
    neighbors:
      - ip: 10.0.200.20
        description: core-sw01-ZONE_B
        remote_as: 65000

# -----------------------------------------------------------------------------
# VLANs
# -----------------------------------------------------------------------------
vlans:
  - id: 100
    name: ZONE_A_HOSTS
    vn_segment: 100100
  - id: 200
    name: ZONE_B_HOSTS
    vn_segment: 100200

# -----------------------------------------------------------------------------
# VRFs
# -----------------------------------------------------------------------------
vrfs:
  - name: ZONE_A
    vni: 100001
    rd: "10.0.255.30:1"
    route_target: "65000:100001"
  - name: ZONE_B
    vni: 100002
    rd: "10.0.255.30:2"
    route_target: "65000:100002"

# -----------------------------------------------------------------------------
# VXLAN
# -----------------------------------------------------------------------------
vxlan_vtep_loopback: loopback1000
vxlan_anycast_gateway_mac: "0001.0001.0001"
vxlan_host_reachability: bgp

vxlan_l2_vnis:
  - vni: 100100
    suppress_arp: true
    bum_method: bgp
  - vni: 100200
    suppress_arp: true
    bum_method: bgp

vxlan_l3_vnis:
  - vni: 100001
  - vni: 100002

vxlan_evpn_vnis:
  - vni: 100100
    rd: auto
    route_target_import: auto
    route_target_export: auto
  - vni: 100200
    rd: auto
    route_target_import: auto
    route_target_export: auto
